<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Favourite Actors</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" type="text/css" href="admin.css">
</head>
<body class="admin-body">

    <main class="admin-wrap">
        <h1 class="admin-title">Favourite Actors — Admin</h1>

        <section id="loginSection" class="panel" hidden>
            <h2>Sign in</h2>
            <form id="loginForm">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
                <p class="error" id="loginError" hidden></p>
            </form>
        </section>

        <section id="appSection" class="panel" hidden>
            <div class="top-row">
                <select id="actorPicker" class="actor-picker">
                    <option value="">+ Add new actor</option>
                </select>
                <button type="button" id="logoutBtn" class="ghost-btn">Log out</button>
            </div>

            <form id="actorForm">
                <div class="name-and-photo-row">
                    <div class="name-fields">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <label for="initials">Initials</label>
                        <input type="text" id="initials" name="initials" maxlength="3">
                    </div>
                    <div class="current-photo-circle" id="currentPhotoCircle">
                        <img id="currentPhotoImg" alt="Current photo" hidden>
                    </div>
                </div>

                <p class="warning" id="duplicateNameWarning" hidden></p>

                <div class="autofill-row">
                    <button type="button" id="autofillLinksBtn" class="ghost-btn" disabled>Autofill links</button>
                    <span id="autofillStatus" class="status"></span>
                </div>

                <label for="imdb">IMDb URL</label>
                <div class="url-field-row">
                    <input type="url" id="imdb" name="imdb">
                    <button type="button" class="open-url-btn ghost-btn" data-target="imdb">Open ↗</button>
                    <button type="button" id="searchImdbBtn" class="ghost-btn" disabled>Search ↗</button>
                </div>

                <label for="tmdb">TMDB URL</label>
                <div class="url-field-row">
                    <input type="url" id="tmdb" name="tmdb">
                    <button type="button" class="open-url-btn ghost-btn" data-target="tmdb">Open ↗</button>
                </div>

                <label for="wiki">Wikipedia URL</label>
                <div class="url-field-row">
                    <input type="url" id="wiki" name="wiki">
                    <button type="button" class="open-url-btn ghost-btn" data-target="wiki">Open ↗</button>
                </div>

                <label for="grokipedia">Grokipedia URL</label>
                <div class="url-field-row">
                    <input type="url" id="grokipedia" name="grokipedia">
                    <button type="button" class="open-url-btn ghost-btn" data-target="grokipedia">Open ↗</button>
                </div>

                <label>Favourites</label>
                <div id="favsList" class="favs-list"></div>
                <button type="button" id="addFavBtn" class="ghost-btn">+ Add favourite</button>

                <div class="credits-field">
                    <button type="button" id="pullCreditsBtn" class="ghost-btn" disabled>Pull filmography from TMDB</button>
                    <span id="creditsStatus" class="status"></span>
                    <div id="creditsList" class="credits-list" hidden></div>
                    <button type="button" id="addSelectedCreditsBtn" class="ghost-btn" hidden>Add selected to favourites</button>
                </div>

                <fieldset class="photo-field">
                    <legend>Photo</legend>
                    <div class="photo-row">
                        <button type="button" id="searchBtn" disabled>Search images</button>
                        <span id="searchStatus" class="status"></span>
                    </div>
                    <div id="resultsGrid" class="results-grid" hidden></div>
                    <button type="button" id="seeMoreBtn" class="ghost-btn" hidden>See more</button>

                    <div id="externalSearchLinks" class="external-search-row" hidden>
                        <span class="status">Not finding it? Search elsewhere:</span>
                        <button type="button" id="googleImagesBtn" class="ghost-btn">Search Google Images ↗</button>
                        <button type="button" id="braveImagesBtn" class="ghost-btn">Search Brave ↗</button>
                        <button type="button" id="duckduckgoImagesBtn" class="ghost-btn">Search DuckDuckGo ↗</button>
                    </div>

                    <div class="manual-url-row">
                        <input type="url" id="manualUrlInput" placeholder="Or paste an image URL directly">
                        <button type="button" id="manualUrlBtn">Use URL</button>
                    </div>
                    <p class="error" id="manualUrlError" hidden></p>

                    <div id="selectedPreview" class="selected-preview" hidden>
                        <img id="selectedThumb" alt="Selected photo">
                        <span id="selectedKey"></span>
                        <button type="button" id="clearSelectionBtn" class="ghost-btn">Clear</button>
                    </div>
                </fieldset>

                <button type="submit" id="saveBtn" disabled>Save actor</button>
                <p class="error" id="saveError" hidden></p>
                <p class="success" id="saveSuccess" hidden></p>
            </form>
        </section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
        <div class="lightbox-inner">
            <button type="button" class="close-btn" id="lightboxClose" aria-label="Close">&times;</button>

            <div id="previewStage">
                <img id="lightboxImg" alt="Full size preview">
                <div class="lightbox-actions">
                    <button type="button" id="startCropBtn">Crop &amp; use this image</button>
                </div>
            </div>

            <div id="cropStage" hidden>
                <div class="crop-viewport" id="cropViewport">
                    <img id="cropImg" alt="">
                </div>
                <input type="range" id="zoomRange" min="0" max="1" step="0.001" value="0">
                <div class="lightbox-actions">
                    <button type="button" id="confirmCropBtn">Use this crop</button>
                    <button type="button" id="cancelCropBtn" class="ghost-btn">Back</button>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
